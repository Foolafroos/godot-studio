name: godot-studio
label: Godot Studio
version: "0.2.0"
description: >
  Headless Godot 4 workflows for the agent game studio — script/resource
  validation without an editor (godot --headless), CI-style exports from
  named presets, a build gallery (godot_builds), and a godot-ai onboarding
  report. Complements the hi-godot/godot-ai MCP server (live editor editing)
  with the half of the loop that needs no GUI: verify → export → playtest.
  Ships an optional desktop half (Godot version chip + builds gallery pane)
  and bundles the godot-studio skill teaching the full loop.
author: Fool (Dingbat)
provides_tools:
  - godot_headless_check
  - godot_export
  - godot_builds
  - godot_setup
